<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Limpiador de texto gratis: convertí mayúsculas, minúsculas y eliminá espacios duplicados."><link rel="canonical" href="https://delagoomar20-web.github.io/mi_web/limpiador-texto.html"><title>Limpiador de texto — QuickTools</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><div class="container nav"><a class="logo" href="index.html"><span class="logo-mark">Q</span> QuickTools</a><nav><a href="index.html#herramientas">Herramientas</a><a href="blog.html">Guías</a></nav></div></header><main><section class="tool-page-hero"><div class="container narrow"><span class="eyebrow">TEXTO · GRATIS</span><h1>Limpiador de texto</h1><p>Transformá y limpiá texto en segundos.</p><div class="calculator"><textarea id="txt" placeholder="Pegá tu texto..."></textarea><button class="button button-primary" id="upper">MAYÚSCULAS</button> <button class="button button-ghost" id="lower">minúsculas</button> <button class="button button-ghost" id="spaces">Limpiar espacios</button><button class="button button-ghost" id="copy">Copiar</button><div class="result"><textarea id="out" placeholder="Resultado..."></textarea></div></div><script>const apply=f=>out.value=f(txt.value);upper.onclick=()=>apply(x=>x.toUpperCase());lower.onclick=()=>apply(x=>x.toLowerCase());spaces.onclick=()=>apply(x=>x.replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim());copy.onclick=()=>navigator.clipboard?.writeText(out.value)</script></div></section></main><footer><div class="container">© 2026 QuickTools · <a href="index.html" style="color:inherit">Inicio</a></div></footer></body></html>
