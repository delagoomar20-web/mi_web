<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Conversor de unidades gratis: longitud, peso y temperatura."><link rel="canonical" href="https://delagoomar20-web.github.io/mi_web/conversor-unidades.html"><title>Conversor de unidades — QuickTools</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><div class="container nav"><a class="logo" href="index.html"><span class="logo-mark">Q</span> QuickTools</a><nav><a href="index.html#herramientas">Herramientas</a><a href="blog.html">Guías</a></nav></div></header><main><section class="tool-page-hero"><div class="container narrow"><span class="eyebrow">CONVERSOR · GRATIS</span><h1>Conversor de unidades</h1><p>Convertí valores comunes de longitud, peso y temperatura.</p><div class="calculator"><select id="unit"><option value="km">km → millas</option><option value="mi">millas → km</option><option value="kg">kg → lb</option><option value="lb">lb → kg</option><option value="c">°C → °F</option><option value="f">°F → °C</option></select><input id="v" type="number" placeholder="Valor" style="margin-top:17px"><button class="button button-primary" id="go">Convertir</button><div class="result" id="result">Ingresá un valor.</div></div><script>go.onclick=()=>{const n=Number(v.value);if(!Number.isFinite(n)){result.textContent='Ingresá un número.';return}let r=unit.value==='km'?n*.621371:unit.value==='mi'?n*1.609344:unit.value==='kg'?n*2.2046226218:unit.value==='lb'?n*.45359237:unit.value==='c'?n*9/5+32:(n-32)*5/9;result.innerHTML='<span class="big">'+r.toLocaleString('es-AR',{maximumFractionDigits:4})+'</span>Resultado convertido'}</script></div></section></main><footer><div class="container">© 2026 QuickTools · <a href="index.html" style="color:inherit">Inicio</a></div></footer></body></html>
