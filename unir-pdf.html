<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Uní imágenes en un PDF gratis y descargá un único documento."><link rel="canonical" href="https://delagoomar20-web.github.io/mi_web/unir-pdf.html"><title>Unir imágenes en PDF gratis — QuickTools</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><div class="container nav"><a class="logo" href="index.html"><span class="logo-mark">Q</span> QuickTools</a></div></header><main><section class="tool-page-hero"><div class="container narrow"><span class="eyebrow">PDF · GRATIS</span><h1>Unir imágenes en un PDF</h1><p>Seleccioná varias imágenes y convertílas en un único PDF.</p><div class="calculator"><input id="files" type="file" accept="image/jpeg,image/png" multiple><button class="button button-primary" id="go">Crear PDF</button><div class="result" id="result">Seleccioná tus imágenes.</div></div></div></section></main><footer><div class="container">© 2026 QuickTools</div></footer><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script>go.onclick=async()=>{const fs=[...files.files];if(!fs.length)return result.textContent='Seleccioná al menos una imagen.';const{jsPDF}=jspdf;const p=new jsPDF();for(let i=0;i<fs.length;i++){if(i)p.addPage();const d=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(fs[i])});const im=await new Promise(r=>{const x=new Image();x.onload=()=>r(x);x.src=d});const s=Math.min(180/im.width,260/im.height);p.addImage(d,im.width*s,14,14,im.width*s,im.height*s)}p.save('quicktools-unido.pdf');result.innerHTML='<span class="big">PDF creado</span>'+fs.length+' páginas.'}</script></body></html>
