<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Convertí PNG a JPG gratis y rápidamente desde el navegador, sin registro."><link rel="canonical" href="https://delagoomar20-web.github.io/mi_web/png-a-jpg.html"><title>PNG a JPG — QuickTools</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><div class="container nav"><a class="logo" href="index.html"><span class="logo-mark">Q</span> QuickTools</a><nav><a href="index.html#herramientas">Herramientas</a><a href="blog.html">Guías</a></nav></div></header><main><section class="tool-page-hero"><div class="container narrow"><span class="eyebrow">IMÁGENES · GRATIS</span><h1>PNG a JPG</h1><p>Convertí una imagen PNG a JPG y descargá el resultado.</p><div class="calculator"><input id="file" type="file" accept="image/png"><button class="button button-primary" id="go">Convertir</button><div class="result" id="result">Elegí una imagen.</div></div><script>go.onclick=()=>{const f=file.files[0];if(!f){result.textContent='Elegí una imagen.';return}const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0);c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='quicktools.jpg';a.click();result.innerHTML='<span class="big">Conversión lista</span>'+f.name},'image/jpeg',.9)};im.src=r.result};r.readAsDataURL(f)}</script></div></section></main><footer><div class="container">© 2026 QuickTools · <a href="index.html" style="color:inherit">Inicio</a></div></footer></body></html>
