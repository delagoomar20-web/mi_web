<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Calculadora de porcentajes online gratis: porcentaje de un número y aumentos o descuentos."><link rel="canonical" href="https://delagoomar20-web.github.io/mi_web/porcentaje.html"><title>Calculadora de porcentajes — QuickTools</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><div class="container nav"><a class="logo" href="index.html"><span class="logo-mark">Q</span> QuickTools</a></div></header><main><section class="tool-page-hero"><div class="container narrow"><span class="eyebrow">CALCULADORA · GRATIS</span><h1>Calculadora de porcentajes</h1><p>Calculá porcentajes, aumentos y descuentos rápidamente.</p><div class="calculator"><div class="form-grid"><label>Número<input id="n" type="number"></label><label>Porcentaje<input id="p" type="number"></label></div><button class="button button-primary" id="go">Calcular</button><div class="result" id="result">Ingresá ambos valores.</div></div></div></section></main><footer><div class="container">© 2026 QuickTools</div></footer><script>go.onclick=()=>{if(n.value===''||p.value==='')return result.textContent='Ingresá ambos valores.';const a=+n.value,b=+p.value;result.innerHTML='<span class="big">'+(a*b/100).toLocaleString('es-AR',{maximumFractionDigits:6})+'</span>'+b+'% de '+a}</script></body></html>
