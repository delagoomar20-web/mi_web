<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Convertí horas a minutos y minutos a horas gratis con QuickTools."><link rel="canonical" href="https://delagoomar20-web.github.io/mi_web/horas-minutos.html"><title>Convertir horas a minutos — QuickTools</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><div class="container nav"><a class="logo" href="index.html"><span class="logo-mark">Q</span> QuickTools</a></div></header><main><section class="tool-page-hero"><div class="container narrow"><span class="eyebrow">CONVERSOR · GRATIS</span><h1>Horas a minutos</h1><p>Convertí horas a minutos o minutos a horas en segundos.</p><div class="calculator"><div class="form-grid"><label>Valor<input id="v" type="number" placeholder="Ej. 2.5"></label><label>Conversión<select id="u"><option value="hm">Horas → minutos</option><option value="mh">Minutos → horas</option></select></label></div><button class="button button-primary" id="go">Convertir</button><div class="result" id="result">Ingresá un valor.</div></div></div></section></main><footer><div class="container">© 2026 QuickTools</div></footer><script>go.onclick=()=>{const n=+v.value;if(!Number.isFinite(n))return result.textContent='Ingresá un número.';const r=u.value==='hm'?n*60:n/60;result.innerHTML='<span class="big">'+r.toLocaleString('es-AR',{maximumFractionDigits:4})+'</span>'+ (u.value==='hm'?'minutos':'horas')}</script></body></html>
