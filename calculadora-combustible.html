<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Calculadora gratuita de combustible: estimá el costo de un viaje, semana o mes.">
  <title>Calculadora de combustible — AutoTools</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header"><div class="container nav"><a class="logo" href="index.html">AutoTools</a><nav><a href="index.html">Inicio</a></nav></div></header>
<main>
<section class="section">
<div class="container narrow">
<span class="eyebrow">Herramienta gratuita</span>
<h1>Calculadora de combustible</h1>
<p>Ingresá los datos de tu auto y calculá cuánto te cuesta un viaje.</p>
<div class="calculator">
<label>Distancia del viaje (km)<input id="distance" type="number" min="0" step="0.1" placeholder="Ej. 120"></label>
<label>Consumo del auto (L/100 km)<input id="consumption" type="number" min="0" step="0.1" placeholder="Ej. 8"></label>
<label>Precio del combustible por litro<input id="price" type="number" min="0" step="1" placeholder="Ej. 1500"></label>
<button id="calculate" class="button" type="button">Calcular costo</button>
<div id="result" class="result" aria-live="polite"></div>
</div>
<div class="info">
<h2>¿Cómo se calcula?</h2>
<p>Litros necesarios = distancia × consumo ÷ 100. Luego multiplicamos los litros por el precio por litro.</p>
</div>
</div>
</section>
</main>
<footer><div class="container">© 2026 AutoTools</div></footer>
<script>
document.getElementById('calculate').addEventListener('click',()=>{
 const d=Number(document.getElementById('distance').value);
 const c=Number(document.getElementById('consumption').value);
 const p=Number(document.getElementById('price').value);
 const result=document.getElementById('result');
 if(!(d>0&&c>0&&p>0)){result.textContent='Completá los tres campos con valores mayores que 0.';return;}
 const liters=d*c/100, cost=liters*p;
 result.innerHTML='<strong>Resultado</strong><br>'+liters.toFixed(2)+' litros · costo estimado: <strong>$ '+cost.toLocaleString('es-AR',{maximumFractionDigits:0})+'</strong>';
});
</script>
</body>
</html>
